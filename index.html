<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="auth-panel" class="todo-container auth-panel" aria-labelledby="auth-title">
            <header class="app-header">
                <span class="eyebrow">YOUR PERSONAL PLANNER</span>
                <h1 id="auth-title">Welcome back</h1>
                <p id="auth-description">Sign in to pick up where you left off.</p>
            </header>

            <div class="auth-tabs" role="group" aria-label="Choose an account action">
                <button id="login-tab" class="auth-tab active" type="button" aria-pressed="true">Log in</button>
                <button id="signup-tab" class="auth-tab" type="button" aria-pressed="false">Create account</button>
            </div>

            <form id="auth-form" class="auth-form">
                <label for="auth-email">Email address</label>
                <input
                    type="email"
                    id="auth-email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="auth-password">Password</label>
                <input
                    type="password"
                    id="auth-password"
                    autocomplete="current-password"
                    minlength="6"
                    placeholder="At least 6 characters"
                    required
                >

                <p id="auth-message" class="form-message" role="status" aria-live="polite"></p>
                <button type="submit" id="auth-submit" class="primary-button">Log in</button>
            </form>
            <p class="auth-footnote">Your tasks stay connected to your account.</p>
        </section>

        <section id="todo-panel" class="todo-container" aria-labelledby="app-title" hidden>
            <header class="app-header">
                <span class="eyebrow">YOUR PERSONAL PLANNER</span>
                <h1 id="app-title">My Todo App</h1>
                <p>Organize your day, one task at a time.</p>
            </header>

            <div class="account-bar">
                <span id="account-email"></span>
                <button id="logout-btn" class="text-button" type="button">Log out</button>
            </div>

            <form id="todo-form" class="todo-form">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Enter your task..."
                    maxlength="500"
                    required
                >
                <button type="submit" id="add-btn">Add Task</button>
            </form>

            <div class="todo-info">
                <h2>My Tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>

            <ul id="todo-list"></ul>
            <p id="empty-message">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
